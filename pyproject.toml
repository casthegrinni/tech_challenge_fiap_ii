[tool.poetry]
name = "tsp-tech-challenge-ii"
version = "0.1.0"
description = "Otimização de Rotas Médicas usando Algoritmos Genéticos e LLMs"
authors = ["Brunno Casthegrinni"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13,!=3.9.7"
streamlit = "1.29.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
folium = "^0.16.0"
streamlit-folium = "0.17.0"
matplotlib = "^3.8.0"
google-generativeai = "^0.8.6"  # Exemplo para Gemini, podemos ajustar

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
